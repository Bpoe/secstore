name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        type: string
      commit:
        description: Exact source commit to build
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Build and package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
          - arch: arm7
            goarch: arm
    env:
      SECSTORE_ARCH: ${{ matrix.arch }}
      SECSTORE_VERSION: ${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: gofmt -w $(git ls-files '*.go') && git diff --exit-code -- '*.go'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build mount tests
        run: go test -c -o secstore.test ./internal/secstore

      - name: Test noswap mounts
        run: sudo unshare --mount --propagation private env SECSTORE_MOUNT_TEST=1 ./secstore.test -test.run '^TestRuntimeIntegration$'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
        run: go build -trimpath -o dist/secstore ./cmd/secstore

      - name: Install packaging tool
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Stage versioned DSC manifest
        run: jq --arg version "$SECSTORE_VERSION" '.version = $version' secstore.dsc.resource.json > dist/secstore.dsc.resource.json

      - name: Package deb
        run: nfpm package --config packaging/nfpm.yaml --packager deb --target dist/

      - name: Package rpm
        run: nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/

      - name: Install pinned DSC for integration
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p "$RUNNER_TEMP/dsc"
          curl --fail --silent --show-error --location \
            https://github.com/PowerShell/DSC/releases/download/v3.3.0/DSC-3.3.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/dsc.tar.gz"
          echo "cf17d1a130b65332ec65380ee9368133101d13d8f40c1a501038920b1e9cd748  $RUNNER_TEMP/dsc.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/dsc.tar.gz" -C "$RUNNER_TEMP/dsc"
          "$RUNNER_TEMP/dsc/dsc" --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

      - name: Test installed DEB and RPM DSC resources
        if: matrix.arch == 'amd64'
        run: |
          for format in deb rpm; do
            root="$RUNNER_TEMP/secstore-$format"
            sudo mkdir -p "$root"
            if [[ "$format" == deb ]]; then
              sudo dpkg --root="$root" --install dist/*.deb
            else
              sudo rpm --root "$root" --initdb
              sudo rpm --root "$root" --install dist/*.rpm
            fi
            test "$(stat -c '%a:%u:%g' "$root/usr/bin/secstore.dsc.resource.json")" = "644:0:0"
            test "$(jq -r .version "$root/usr/bin/secstore.dsc.resource.json")" = "$SECSTORE_VERSION"
            sudo unshare --mount --propagation private env \
              SECSTORE_TEST_DSC="$RUNNER_TEMP/dsc/dsc" \
              SECSTORE_TEST_BINARY="$root/usr/bin/secstore" \
              SECSTORE_TEST_MANIFEST="$root/usr/bin/secstore.dsc.resource.json" \
              ./secstore.test -test.run '^TestDSCIntegration$' -test.v
          done

      - name: Package archive and checksums
        run: bash packaging/archive.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secstore-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          overwrite: true
